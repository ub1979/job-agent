[project]
name = "job-agent"
version = "0.1.0"
description = "A local, conversational job-search workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "reportlab>=4.3,<5",
    "beautifulsoup4>=4.13,<5",
    "pycountry>=24.6",
    "ddgs>=9,<10",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
